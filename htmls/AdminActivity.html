<div class="lv-site lv-admin" id="lv-site" data-theme="light" style="{plhd_style}">
<header class="lv-ahead">
    <button type="button" class="lv-ibtn lv-burger" aria-label="Menu" onclick="AdminActivityJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="lv-abrand" href="Admin"><svg class="lv-logo" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="var(--lv-accent)"/><path d="M8 21L20 10l12 11" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.5 19.5V30h15V19.5" fill="none" stroke="#fff" stroke-width="2.8" stroke-linejoin="round"/><path d="M17.5 30v-6h5v6" fill="#fff"/></svg>{plhd_name}<span>Admin</span></a>
    <span class="lv-grow"></span>
    <a class="lv-who" id="lv-who" href="AdminAccount"></a>
    <a class="lv-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="lv-out" onclick="AdminActivityJs.signOut()">Sign out</button>
</header>
<aside class="lv-side" id="lv-nav" aria-label="Admin">
    <div class="lv-nav-top"><span>Menu</span><button type="button" class="lv-ibtn" aria-label="Close" onclick="AdminActivityJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="lv-amenu" id="lv-menu"></ul>
</aside>
<div class="lv-scrim" id="lv-scrim" onclick="AdminActivityJs.closeNav()"></div>
<main class="lv-amain" id="lv-main"><p class="lv-loading">Loading&hellip;</p></main>
<div class="lv-modal" id="lv-modal" onclick="if(event.target===this)AdminActivityJs.closeModal()">
    <div class="lv-mbox" role="dialog" aria-modal="true"><button type="button" class="lv-ibtn lv-mclose" aria-label="Close" onclick="AdminActivityJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="lv-mbody"></div></div>
</div>
<div class="lv-toast" id="lv-toast" role="status" aria-live="polite"></div>
</div>
