<div class="vw-site vw-admin" id="vw-site" data-theme="light" style="{plhd_style}">
<header class="vw-ahead">
    <button type="button" class="vw-ibtn vw-burger" aria-label="Menu" onclick="AdminViewingsJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="vw-abrand" href="Admin"><svg class="vw-logo" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="var(--vw-accent)"/><path d="M8 21L20 10l12 11" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.5 19.5V30h15V19.5" fill="none" stroke="#fff" stroke-width="2.8" stroke-linejoin="round"/><path d="M17.5 30v-6h5v6" fill="#fff"/></svg>{plhd_name}<span>Admin</span></a>
    <span class="vw-grow"></span>
    <a class="vw-who" id="vw-who" href="AdminAccount"></a>
    <a class="vw-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="vw-out" onclick="AdminViewingsJs.signOut()">Sign out</button>
</header>
<aside class="vw-side" id="vw-nav" aria-label="Admin">
    <div class="vw-nav-top"><span>Menu</span><button type="button" class="vw-ibtn" aria-label="Close" onclick="AdminViewingsJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="vw-amenu" id="vw-menu"></ul>
</aside>
<div class="vw-scrim" id="vw-scrim" onclick="AdminViewingsJs.closeNav()"></div>
<main class="vw-amain" id="vw-main"><p class="vw-loading">Loading&hellip;</p></main>
<div class="vw-modal" id="vw-modal" onclick="if(event.target===this)AdminViewingsJs.closeModal()">
    <div class="vw-mbox" role="dialog" aria-modal="true"><button type="button" class="vw-ibtn vw-mclose" aria-label="Close" onclick="AdminViewingsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="vw-mbody"></div></div>
</div>
<div class="vw-toast" id="vw-toast" role="status" aria-live="polite"></div>
</div>
