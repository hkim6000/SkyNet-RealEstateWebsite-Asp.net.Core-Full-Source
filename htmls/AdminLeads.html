<div class="le-site le-admin" id="le-site" data-theme="light" style="{plhd_style}">
<header class="le-ahead">
    <button type="button" class="le-ibtn le-burger" aria-label="Menu" onclick="AdminLeadsJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="le-abrand" href="Admin"><svg class="le-logo" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="var(--le-accent)"/><path d="M8 21L20 10l12 11" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.5 19.5V30h15V19.5" fill="none" stroke="#fff" stroke-width="2.8" stroke-linejoin="round"/><path d="M17.5 30v-6h5v6" fill="#fff"/></svg>{plhd_name}<span>Admin</span></a>
    <span class="le-grow"></span>
    <a class="le-who" id="le-who" href="AdminAccount"></a>
    <a class="le-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="le-out" onclick="AdminLeadsJs.signOut()">Sign out</button>
</header>
<aside class="le-side" id="le-nav" aria-label="Admin">
    <div class="le-nav-top"><span>Menu</span><button type="button" class="le-ibtn" aria-label="Close" onclick="AdminLeadsJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="le-amenu" id="le-menu"></ul>
</aside>
<div class="le-scrim" id="le-scrim" onclick="AdminLeadsJs.closeNav()"></div>
<main class="le-amain" id="le-main"><p class="le-loading">Loading&hellip;</p></main>
<div class="le-modal" id="le-modal" onclick="if(event.target===this)AdminLeadsJs.closeModal()">
    <div class="le-mbox" role="dialog" aria-modal="true"><button type="button" class="le-ibtn le-mclose" aria-label="Close" onclick="AdminLeadsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="le-mbody"></div></div>
</div>
<div class="le-toast" id="le-toast" role="status" aria-live="polite"></div>
</div>
