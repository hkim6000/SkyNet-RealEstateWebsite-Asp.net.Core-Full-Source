<div class="ac-site ac-admin" id="ac-site" data-theme="light" style="{plhd_style}">
<header class="ac-ahead">
    <button type="button" class="ac-ibtn ac-burger" aria-label="Menu" onclick="AdminAccountJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="ac-abrand" href="Admin"><svg class="ac-logo" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="var(--ac-accent)"/><path d="M8 21L20 10l12 11" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.5 19.5V30h15V19.5" fill="none" stroke="#fff" stroke-width="2.8" stroke-linejoin="round"/><path d="M17.5 30v-6h5v6" fill="#fff"/></svg>{plhd_name}<span>Admin</span></a>
    <span class="ac-grow"></span>
    <a class="ac-who" id="ac-who" href="AdminAccount"></a>
    <a class="ac-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="ac-out" onclick="AdminAccountJs.signOut()">Sign out</button>
</header>
<aside class="ac-side" id="ac-nav" aria-label="Admin">
    <div class="ac-nav-top"><span>Menu</span><button type="button" class="ac-ibtn" aria-label="Close" onclick="AdminAccountJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="ac-amenu" id="ac-menu"></ul>
</aside>
<div class="ac-scrim" id="ac-scrim" onclick="AdminAccountJs.closeNav()"></div>
<main class="ac-amain" id="ac-main"><p class="ac-loading">Loading&hellip;</p></main>
<div class="ac-modal" id="ac-modal" onclick="if(event.target===this)AdminAccountJs.closeModal()">
    <div class="ac-mbox" role="dialog" aria-modal="true"><button type="button" class="ac-ibtn ac-mclose" aria-label="Close" onclick="AdminAccountJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="ac-mbody"></div></div>
</div>
<div class="ac-toast" id="ac-toast" role="status" aria-live="polite"></div>
</div>
