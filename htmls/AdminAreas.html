<div class="ar-site ar-admin" id="ar-site" data-theme="light" style="{plhd_style}">
<header class="ar-ahead">
    <button type="button" class="ar-ibtn ar-burger" aria-label="Menu" onclick="AdminAreasJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="ar-abrand" href="Admin"><svg class="ar-logo" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="var(--ar-accent)"/><path d="M8 21L20 10l12 11" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.5 19.5V30h15V19.5" fill="none" stroke="#fff" stroke-width="2.8" stroke-linejoin="round"/><path d="M17.5 30v-6h5v6" fill="#fff"/></svg>{plhd_name}<span>Admin</span></a>
    <span class="ar-grow"></span>
    <a class="ar-who" id="ar-who" href="AdminAccount"></a>
    <a class="ar-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="ar-out" onclick="AdminAreasJs.signOut()">Sign out</button>
</header>
<aside class="ar-side" id="ar-nav" aria-label="Admin">
    <div class="ar-nav-top"><span>Menu</span><button type="button" class="ar-ibtn" aria-label="Close" onclick="AdminAreasJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="ar-amenu" id="ar-menu"></ul>
</aside>
<div class="ar-scrim" id="ar-scrim" onclick="AdminAreasJs.closeNav()"></div>
<main class="ar-amain" id="ar-main"><p class="ar-loading">Loading&hellip;</p></main>
<div class="ar-modal" id="ar-modal" onclick="if(event.target===this)AdminAreasJs.closeModal()">
    <div class="ar-mbox" role="dialog" aria-modal="true"><button type="button" class="ar-ibtn ar-mclose" aria-label="Close" onclick="AdminAreasJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="ar-mbody"></div></div>
</div>
<div class="ar-toast" id="ar-toast" role="status" aria-live="polite"></div>
</div>
